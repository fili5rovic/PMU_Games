[versions]
# --- Zateceni toolchain (dolazi iz Android Studio template-a) ---
agp = "9.3.2"
# Kotlin MORA da ostane jednak KGP verziji koju AGP 9.3.2 nosi u sebi.
# AGP 9 ima built-in Kotlin support, pa se plugin "org.jetbrains.kotlin.android"
# NE primenjuje (na AGP 9 to je greska). Primenjuju se samo compiler plugin-ovi.
appcompat = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"

# --- Annotation processing ---
# KSP se od verzije 2.3.0 versionise NEZAVISNO od Kotlina (stara shema je bila
# "<kotlin>-<ksp>", npr. 2.2.10-2.0.2). Podrska za AGP-ov built-in Kotlin je
# dodata u KSP 2.3.1, pa stara shema ovde ne bi radila.
ksp = "2.3.11"

# --- Dependency injection ---
# Hilt < 2.59.2 ne radi na AGP 9 (ne nalazi AGP base extension).
hilt = "2.60.1"
androidxHilt = "1.4.0"

# --- Ostale biblioteke ---
room = "2.8.4"
navigationCompose = "2.9.8"
work = "2.11.2"
lifecycle = "2.11.0"
retrofit = "3.0.0"
# 1.10.0 zahteva Kotlin 2.3.0, a 1.11.0 zahteva 2.3.20 -> ostajemo na 1.9.0.
kotlinxSerializationJson = "1.9.0"
datastore = "1.2.1"

# --- AndroidX osnovne ---
# AGP 9 je ugasio "android.dependency.useConstraints", pa se AndroidX verzije
# vise ne poravnavaju automatski i moraju biti rucno konsistentne.
coreKtx = "1.19.0"
activityCompose = "1.13.0"

# --- Test ---
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
testRunner = "1.7.0"
# 1.11.0 zahteva kotlin-stdlib 2.2.20 (iznad naseg compiler-a) -> 1.10.2.
coroutinesTest = "1.10.2"

[libraries]
# Compose
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# material-android 1.10.4 vise NE vuce material-icons-core tranzitivno,
# a bez njega se Icons.* ne kompajlira.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# AndroidX osnovne
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Lifecycle / ViewModel (Compose BOM NE upravlja androidx.lifecycle)
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation (Compose BOM NE upravlja androidx.navigation)
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# WorkManager
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# DataStore (settings)
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# REST
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
# Hilt u instrumentacionim testovima: zamena modula preko @TestInstallIn.
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
